name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_DIR: sentinal-chat

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build check
        run: go build ./...

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "
            set -euo pipefail
            cd ~/${DEPLOY_DIR}
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            if [ ! -f .env ]; then
              echo '.env not found in ~/sentinal-chat. Create it first.'
              exit 1
            fi
            set -a
            . ./.env
            set +a
            docker info >/dev/null
            docker compose --env-file .env up -d --build api
            ok=0
            for i in \$(seq 1 30); do
              if curl -fsS "http://127.0.0.1:\${APP_PORT:-5000}/health" >/dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "\$ok" -ne 1 ]; then
              echo 'Health check failed. Recent logs:'
              docker compose --env-file .env ps || true
              docker compose --env-file .env logs --tail=200 api postgres redis || true
              exit 1
            fi
          "
